[package]
name = "tonetinkerer-plugin"
description = "ToneTinkerer: neural guitar amplifier simulator (VST3 / CLAP)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
# Abort on any allocation inside process() in debug builds (used in CI/dev).
assert_process_allocs = ["nice-plug/assert_process_allocs"]
# A standalone app (development: GUI checks without a DAW).
standalone = ["nice-plug/standalone"]

[[bin]]
name = "tonetinkerer-standalone"
path = "src/bin/standalone.rs"
required-features = ["standalone"]

[dependencies]
tonetinkerer-dsp = { path = "../tonetinkerer-dsp" }
nice-plug = { workspace = true, features = ["editor", "vst3"] }
nice-plug-egui.workspace = true
egui.workspace = true
rtrb.workspace = true
atomic_float.workspace = true
serde.workspace = true
parking_lot.workspace = true
rfd.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
